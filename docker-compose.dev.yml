# Surcouche pour le poste de développement (N8N_DOMAIN=localhost dans .env) :
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Ports ouverts uniquement sur 127.0.0.1. Ne pas utiliser sur le VPS.

services:
  caddy:
    # Remplace les ports 80/443 du fichier principal (souvent déjà pris en local).
    ports: !override
      - "127.0.0.1:${DEV_HTTPS_PORT:-8443}:443"

  n8n:
    environment:
      N8N_EDITOR_BASE_URL: https://localhost:${DEV_HTTPS_PORT:-8443}/
      WEBHOOK_URL: https://localhost:${DEV_HTTPS_PORT:-8443}/

  api:
    ports:
      - "127.0.0.1:8000:8000"

  postgres:
    ports:
      # 5433 par défaut : 5432 est souvent pris par un Postgres local.
      - "127.0.0.1:${DEV_POSTGRES_PORT:-5433}:5432"
    # Un conteneur relié uniquement à un réseau `internal` ne peut pas publier de port.
    networks: [internal, dev]

networks:
  dev:
