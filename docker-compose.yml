name: prospecting

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      N8N_DOMAIN: ${N8N_DOMAIN}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on: [n8n]

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION}
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_DOMAIN}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_DOMAIN}/
      N8N_PROXY_HOPS: 1
      GENERIC_TIMEZONE: Europe/Paris
      TZ: Europe/Paris
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336 # heures (14 jours) : les exécutions contiennent des données prospects
      # Les workflows ne lisent pas l'environnement (secrets de ce conteneur).
      # La clé de l'API passe par un identifiant n8n « Header Auth », stocké chiffré.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data/imports:/data/imports
    networks: [edge, internal]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://prospecting:${APP_DB_PASSWORD}@postgres:5432/prospecting
      API_KEY: ${API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      HUNTER_API_KEY: ${HUNTER_API_KEY:-}
      # Optionnel : autres modèles OpenAI (défauts : gpt-5.4-mini / gpt-5.4-nano)
      MODEL_WRITER: ${MODEL_WRITER:-gpt-5.4-mini}
      MODEL_CLASSIFIER: ${MODEL_CLASSIFIER:-gpt-5.4-nano}
      OPTOUT_SALT: ${OPTOUT_SALT}
      PLAYBOOK_DIR: /app/playbook
    volumes:
      - ./playbook:/app/playbook:ro
    # Aucun port publié : seul n8n appelle l'API, via le réseau interne.
    networks: [internal, egress]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  # Réseau exposé derrière Caddy.
  edge:
  # Réseau sans accès Internet : Postgres n'est joignable que par n8n et l'API.
  internal:
    internal: true
  # Accès sortant de l'API (API OpenAI, API Recherche d'entreprises, Hunter).
  egress:

volumes:
  caddy_data:
  caddy_config:
  n8n_data:
  postgres_data:
